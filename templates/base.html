<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Pushover Web{% endblock %}</title>
    {% block head %}{% endblock %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  </head>
  <body>
    <div class="page-shell">
      <header class="hero">
        <div class="hero-brand">
          <img class="brand-logo" src="{{ url_for('static', filename='images/Pushover.png') }}" alt="Pushover Web logo">
          <div>
            <p class="eyebrow">Pushover Web</p>
            <h1>Notifications</h1>
          </div>
        </div>
      </header>
      <main>
        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>
